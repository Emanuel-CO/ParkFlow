    // Web Audio Synthesizer
    let audioCtx = null;
    function playCyberAudio(type = 'click') {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const now = audioCtx.currentTime;
        const master = audioCtx.createGain();
        master.gain.setValueAtTime(0.2, now);
        master.connect(audioCtx.destination);

        if (type === 'click') {
          const osc = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(1400, now);
          osc.frequency.exponentialRampToValueAtTime(700, now + 0.04);
          g.gain.setValueAtTime(0.3, now);
          g.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
          osc.connect(g); g.connect(master);
          osc.start(now); osc.stop(now + 0.05);
        } else if (type === 'laser') {
          const osc = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(2400, now);
          osc.frequency.exponentialRampToValueAtTime(300, now + 0.12);
          g.gain.setValueAtTime(0.25, now);
          g.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
          osc.connect(g); g.connect(master);
          osc.start(now); osc.stop(now + 0.13);
        } else if (type === 'checkout') {
          [0, 0.08, 0.16].forEach((d, idx) => {
            const osc = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            const notes = [523.25, 659.25, 1046.5];
            osc.frequency.setValueAtTime(notes[idx], now + d);
            g.gain.setValueAtTime(0, now + d);
            g.gain.linearRampToValueAtTime(0.4, now + d + 0.02);
            g.gain.exponentialRampToValueAtTime(0.001, now + d + 0.25);
            osc.connect(g); g.connect(master);
            osc.start(now + d); osc.stop(now + d + 0.28);
          });
        }
      } catch (e) {}
    }

    // Generate full 50 cells (Zona A: 30 Carros [A-01 a A-30], Zona B: 20 Motos [B-01 a B-20])

    // ── MOTOR CRIPTOGRÁFICO & ALMACENAMIENTO SEGURO DE USUARIOS ──
    async function hashSha256(text) {
      if (!text) return '';
      try {
        const encoder = new TextEncoder();
        const data = encoder.encode(text);
        const hashBuffer = await crypto.subtle.digest('SHA-256', data);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
      } catch (e) {
        // Fallback simple determinista para entornos sin crypto.subtle
        let hash = 0;
        for (let i = 0; i < text.length; i++) {
          const char = text.charCodeAt(i);
          hash = ((hash << 5) - hash) + char;
          hash |= 0;
        }
        return 'sha256_mock_' + Math.abs(hash);
      }
    }

        const rate = c.ratePerHour || (c.type === 'Moto' ? 2500 : c.type === 'Pesado' ? 9000 : 5000);
        if (!ts) return c.currentTotal || rate;
        const diffHours = Math.max(0.01, (Date.now() - ts) / (1000 * 3600));
        const billedHours = Math.max(1, Math.ceil(diffHours));
        return billedHours * rate;
      };

      const calculateDetailedBilling = (cell) => {
        if (!cell || cell.status !== 'occupied') {
          return {
            hours: 0,
            minutes: 0,
            seconds: 0,
            durationStr: '--',
            ratePerHour: 5000,
            hoursFee: 0,
            fractionMinutes: 0,
            fractionFee: 0,
            totalDue: 0,
          };
        }

        const nowTs = Date.now();
        let entryTs = cell.entryTimestamp || cell.occupiedTimestamp;
        if (!entryTs) {
          if (cell.elapsedSec) {
            entryTs = nowTs - (cell.elapsedSec * 1000);
          } else {
            entryTs = nowTs - (3 * 3600 * 1000 + 15 * 60 * 1000);
          }
        }

        const diffSec = Math.max(0, Math.floor((nowTs - entryTs) / 1000));
        const hours = Math.floor(diffSec / 3600);
        const minutes = Math.floor((diffSec % 3600) / 60);
        const seconds = diffSec % 60;
        const durationStr = `${hours}h ${String(minutes).padStart(2, '0')}m ${String(seconds).padStart(2, '0')}s`;

        const ratePerHour = cell.ratePerHour || (cell.type === 'Moto' || cell.category === 'Moto' ? 2500 : cell.type === 'Pesado' || cell.category === 'Pesado' ? 9000 : 4500);
        const hoursFee = hours * ratePerHour;
        
        let fractionFee = 0;
        if (minutes > 0) {
          if (minutes <= 15) {
            fractionFee = Math.round(ratePerHour * 0.25);
          } else if (minutes <= 30) {
            fractionFee = Math.round(ratePerHour * 0.5);
          } else if (minutes <= 45) {
            fractionFee = Math.round(ratePerHour * 0.75);
          } else {
            fractionFee = ratePerHour;
          }
        }

        let totalDue = hoursFee + fractionFee;
        if (hours === 0 && minutes <= 15 && diffSec < 900) {
          fractionFee = Math.round(ratePerHour * 0.25);
          totalDue = fractionFee;
        }
        if (totalDue === 0) totalDue = ratePerHour;

        return {
          hours,
          minutes,
          seconds,
          durationStr,
          ratePerHour,
          hoursFee,
          fractionMinutes: minutes,
          fractionFee,
          totalDue,
        };

          localStorage.setItem('parkflow_last_event', JSON.stringify(evData));
        } catch (e) {}

        if (clientIssuedTicket && clientIssuedTicket.cellId === cellId) {
          setClientIssuedTicket(null);
        }

        if (selectedCell && selectedCell.id === cellId) {
          setSelectedCell(null);
        }

        showToast(`❌ Solicitud para Bahía ${cellId} rechazada. El puesto ha sido liberado.`, 'warning');
      };

      // Cancelación voluntaria por parte del Cliente
      const handleCancelClientRequest = (cellId) => {
        playCyberAudio('click');
        const updatedCells = cells.map(c => {
          if (c.id === cellId && (c.status === 'reserved' || c.isPendingApproval)) {
            return {
              id: c.id,
              zone: c.zone,
              category: c.category,
              status: 'free',
              ratePerHour: c.ratePerHour || 4500,
            };
          }
          return c;
        });

        setCells(updatedCells);
        try { localStorage.setItem('parkflow_cells', JSON.stringify(updatedCells)); } catch (e) {}
        setClientIssuedTicket(null);
        showToast('Solicitud de bahía cancelada por el usuario.', 'info');
      };

      // Client Checkout Simulation
      const handleClientPay = (plate) => {
        playCyberAudio('checkout');
        setClientPaymentSuccess(true);
        const clean = plate.trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
        const updated = cells.map(c => (c.plate && c.plate.trim().toUpperCase().replace(/[^A-Z0-9]/g, '') === clean) ? {
          ...c,
          status: 'free',
          plate: undefined,
          driverName: undefined,
          isClientAutoOccupied: undefined,
          entryTimestamp: undefined,
          occupiedTimestamp: undefined,
          duration: undefined,
          currentTotal: undefined
        } : c);
        setCells(updated);
        try { localStorage.setItem('parkflow_cells', JSON.stringify(updated)); } catch(e) {}
        showToast('¡Pago en línea completado! 15 min de tolerancia para salir.', 'success');
      };

      // Client Checkout Decision: Tarjeta o Efectivo con Recibo Digital
      const handleClientCheckoutDecision = (targetPlate, method) => {
        const clean = (targetPlate || '').trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
        const targetCell = cells.find(c => c.status === 'occupied' && c.plate && c.plate.trim().toUpperCase().replace(/[^A-Z0-9]/g, '') === clean);
        
        if (!targetCell) {
          playCyberAudio('laser');
          showToast(`No se encontró un vehículo activo con la placa ${targetPlate} en patio.`, 'error');
          return;
        }

        playCyberAudio('checkout');
        const rate = targetCell.ratePerHour || (targetCell.type === 'Moto' ? 2500 : targetCell.type === 'Pesado' ? 9000 : 5000);
        const liveDur = getLiveDuration(targetCell);
        const amount = calculateLiveAmount(targetCell);

        const receipt = {
          receiptId: `REC-${Date.now().toString().slice(-6)}`,
          ticketId: targetCell.ticketId || `TK-${Math.floor(1000 + Math.random() * 9000)}`,
          plate: targetCell.plate,
          cellId: targetCell.id,
          vehicleType: targetCell.type || 'Carro',
          driverName: targetCell.driverName || currentUser?.name || 'Cliente',
          entryTime: targetCell.entryTime || '11:15 AM',
          duration: liveDur,
          amountPaid: amount,
          paymentMethod: method === 'tarjeta' ? 'Tarjeta de Crédito / Débito (En Línea)' : 'Efectivo (Liquidación Taquilla / Tótem)',
          methodCode: method,
          paidAt: new Date().toLocaleTimeString(),
          toleranceMinutes: 15,
        };

        setClientPaymentReceipt(receipt);

        // Liberar la celda en tiempo real
        const updated = cells.map(c => c.id === targetCell.id ? {
          ...c,
          status: 'free',
          plate: undefined,
          driverName: undefined,
          isClientAutoOccupied: undefined,
          entryTimestamp: undefined,
          occupiedTimestamp: undefined,
          duration: undefined,
          currentTotal: undefined
        } : c);
        setCells(updated);
        try { localStorage.setItem('parkflow_cells', JSON.stringify(updated)); } catch(e) {}

        showToast(
          method === 'tarjeta' 
            ? `✅ Pago de $${amount.toLocaleString('es-CO')} COP con tarjeta exitoso. Tienes 15 min de gracia.`
            : `✅ Orden de pago en efectivo generada ($${amount.toLocaleString('es-CO')} COP). Bahía ${targetCell.id} liberada.`,
          'success'
        );
      };

      const handleConfirmPayment = (targetCell, totalDue, method, received) => {
        if (!targetCell) {
          playCyberAudio('laser');
          showToast('Seleccione o digite la placa de un vehículo estacionado para liquidar', 'warning');
          return;
        }

        if (method === 'cash' && received < totalDue) {
          playCyberAudio('laser');
          showToast(`El monto en efectivo recibido es insuficiente. Faltan $${(totalDue - received).toLocaleString('es-CO')} COP`, 'error');
          return;
        }

        playCyberAudio('checkout');
        const now = new Date();
        const liveDur = getLiveDuration(targetCell);
        const change = method === 'cash' ? Math.max(0, received - totalDue) : 0;
        const methodStr = method === 'cash' ? 'Efectivo en Caja' : method === 'card' ? 'Tarjeta Débito / Crédito NFC' : 'QR Digital (Nequi / Bancolombia)';

        const receipt = {
          receiptId: `REC-${Date.now().toString().slice(-6)}`,
          ticketId: targetCell.ticketId || `#TK-2099-${targetCell.id.replace('-', '')}`,
          plate: targetCell.plate,
          cellId: targetCell.id,
          category: targetCell.category || targetCell.type || 'Carro',
          driverName: targetCell.driverName || 'Conductor General',
          entryTime: targetCell.entryTime || '08:30 AM',
          exitTime: now.toLocaleTimeString(),
          duration: liveDur,
          ratePerHour: targetCell.ratePerHour || (targetCell.type === 'Moto' ? 2500 : targetCell.type === 'Pesado' ? 9000 : 4500),
          totalDue: totalDue,
          amountReceived: method === 'cash' ? received : totalDue,
          change: change,
          paymentMethod: methodStr,
          operatorName: currentUser?.name || 'Operador de Turno',
          operatorBadge: currentUser?.badge || 'OP-418',
          timestamp: now.toLocaleString('es-CO'),
        };

        setCheckoutReceipt(receipt);
        setCheckoutSuccess(true);

        // Liberar la celda seleccionada en tiempo real
        const updated = cells.map(c => c.id === targetCell.id ? {
          ...c,
          status: 'free',
          plate: undefined,
          duration: undefined,
          driverName: undefined,
          isClientAutoOccupied: undefined,
          entryTimestamp: undefined,
          occupiedTimestamp: undefined,
          currentTotal: undefined,
          ticketId: undefined
        } : c);
        setCells(updated);
        try { localStorage.setItem('parkflow_cells', JSON.stringify(updated)); } catch(e) {}

        // Enviar telemetría de salida
        const evData = {
          id: Date.now(),
          type: 'exit',
          cellId: targetCell.id,
          plate: targetCell.plate,
          category: targetCell.category || targetCell.type || 'Carro',
          time: now.toLocaleTimeString(),
          message: `Salida de taquilla: ${targetCell.plate} liberó bahía ${targetCell.id}. Liquidado $${totalDue.toLocaleString('es-CO')} COP.`
        };
        setLastLiveEvent(evData);
        try { localStorage.setItem('parkflow_last_event', JSON.stringify(evData)); } catch(e) {}

        showToast(`¡Liquidación exitosa! Vehículo ${targetCell.plate} retirado de celda ${targetCell.id}. Barrera de salida abierta.`, 'success');
      };

      const handleTriggerLpr = () => {
        setIsScanningLpr(true);
        playCyberAudio('laser');
        setTimeout(() => {
          setIsScanningLpr(false);
          const occupied = cells.filter(c => c.status === 'occupied' && c.plate);
          const target = occupied.length > 0 ? occupied[0] : null;
          if (target) {
            setSearchQuery(target.plate);
            setReceivedAmount(calculateDetailedBilling(target).totalDue);
            showToast(`Cámara LPR salida: Placa ${target.plate} leída en barrera (Confianza: 99.4%)`, 'success');
          } else {
            showToast('Cámara LPR activa: No se detectan vehículos en barrera de salida', 'info');
          }
          playCyberAudio('checkout');
        }, 800);
      };

      const handleRegisterEntry = (e) => {
        if (e && e.preventDefault) e.preventDefault();
        const clean = regPlate.trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
        if (!clean || clean.length < 3) {
          showToast('Ingrese una placa válida antes de continuar', 'warning');
          return;
        }

        // Anti-Passback: Validar si la placa ya se encuentra dentro del patio
        const alreadyInside = cells.find(c => c.status === 'occupied' && c.plate && c.plate.trim().toUpperCase().replace(/[^A-Z0-9]/g, '') === clean);
        if (alreadyInside) {
          playCyberAudio('laser');
          showToast(`BLOQUEO ANTI-PASSBACK: El vehículo con placa ${regPlate.toUpperCase()} ya se encuentra registrado en la bahía ${alreadyInside.id}. No se permite registrar una misma placa dos veces en patio.`, 'error');
          return;
        }

        // Determinación de la bahía a colocar el vehículo
        const targetZone = (regCat === 'Moto') ? 'Zona B' : 'Zona A';
        let targetCell = null;

        if (regSlotMode === 'manual' && regSelectedSlot) {
          targetCell = cells.find(c => c.id === regSelectedSlot && c.status === 'free');
          if (!targetCell) {
            showToast(`La bahía seleccionada ${regSelectedSlot} ya fue ocupada. Asignando bahía recomendada en ${targetZone}.`, 'warning');
          }
        }

        if (!targetCell) {
          targetCell = cells.find(c => c.zone === targetZone && c.status === 'free') || cells.find(c => c.status === 'free');
        }

        if (!targetCell) {
          playCyberAudio('laser');
          showToast('No hay bahías disponibles para esta categoría en este momento', 'error');
          return;
        }

        playCyberAudio('checkout');
        const now = new Date();
        const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        const dateStr = now.toLocaleDateString([], { day: '2-digit', month: 'short', year: 'numeric' });
        const entryTs = Date.now();
        const rate = (regCat === 'Moto') ? 2500 : (regCat === 'Pesado' ? 9000 : 4500);
        const initialTotal = Math.round(rate * 0.55);
        const ticketNum = `#PF-${now.getFullYear()}-${Math.floor(10000 + Math.random() * 90000)}`;

        const driverNameVal = regDriverName.trim() || 'Cliente Particular (Presencial)';
        const driverDocVal = regDriverDoc.trim() || 'No suministrado';
        const driverPhoneVal = regDriverPhone.trim() || 'No suministrado';
        const vehicleBrandVal = regVehicleBrand.trim();
        const notesVal = [regNotes.trim(), vehicleBrandVal ? `Marca/Color: ${vehicleBrandVal}` : ''].filter(Boolean).join(' | ') || 'Ingreso manual presencial';

        const updatedCells = cells.map(c => c.id === targetCell.id ? {
          ...c,
          status: 'occupied',
          plate: regPlate.toUpperCase(),
          category: regCat,
          driverName: driverNameVal,
          driverDoc: driverDocVal,
          driverPhone: driverPhoneVal,
          brand: vehicleBrandVal,
          entryTime: timeStr,
          entryDate: dateStr,
          entryTimestamp: entryTs,
          occupiedTimestamp: entryTs,
          duration: '0h 00m 00s',
          currentTotal: initialTotal,
          ratePerHour: rate,
          ticketId: ticketNum,
          notes: notesVal,
        } : c);

        setCells(updatedCells);
        try { localStorage.setItem('parkflow_cells', JSON.stringify(updatedCells)); } catch(e) {}

        const evData = {
          type: 'checkin',
          driver: driverNameVal,
          plate: regPlate.toUpperCase(),
          cellId: targetCell.id,
          time: timeStr,
          amount: 0,
          timestamp: entryTs
        };
        setLastLiveEvent(evData);
        try { localStorage.setItem('parkflow_last_event', JSON.stringify(evData)); } catch(e) {}

        const ticketData = {
          ticketId: ticketNum,
          plate: regPlate.toUpperCase(),
          category: regCat,
          slotId: targetCell.id,
          zone: targetCell.zone,
          driverName: driverNameVal,
          driverDoc: driverDocVal,
          driverPhone: driverPhoneVal,
          brand: vehicleBrandVal,
          entryTime: timeStr,
          entryDate: dateStr,
          entryTimestamp: entryTs,
          ratePerHour: rate,
          notes: notesVal,
        };

        setRegIssuedTicket(ticketData);
        showToast(`✅ Vehículo ${regPlate.toUpperCase()} asignado a bahía ${targetCell.id}. Ticket generado y barrera de entrada abierta.`, 'success');
      };

      const handleResetRegEntry = () => {
        setRegPlate('');
        setRegDriverName('');
        setRegDriverDoc('');
        setRegDriverPhone('');
        setRegNotes('');
        setRegVehicleBrand('');
        setRegSelectedSlot('');
        setRegSlotMode('auto');
        setRegIssuedTicket(null);
        playCyberAudio('click');
      };

      // Filtered navigation based on Role
      const getNavItems = () => {
        const pendingCount = cells.filter(c => c.status === 'reserved' || c.isPendingApproval).length;
        if (userRole === 'cliente') {
          return [
            { id: 'portal-cliente', label: 'Elegir Mi Puesto', sub: 'Mapa & Auto-Ticket', icon: 'local_parking' },
            { id: 'consulta-pago', label: 'Mi Permanencia', sub: 'Consultar & Pagar Ya', icon: 'timer' },
            { id: 'mi-perfil-cliente', label: 'Mi Perfil Conductor', sub: 'Billetera & Vehículo', icon: 'account_circle' },
          ];
        }
        if (userRole === 'operador') {
          return [
            { id: 'panel-operativo', label: 'Panel Operativo', sub: pendingCount > 0 ? `🔔 ${pendingCount} Solicitudes` : 'HUD Telemetría 3D', icon: 'grid_view' },
            { id: 'registro-de-entrada', label: 'Registro Entrada', sub: pendingCount > 0 ? `(${pendingCount} Pendientes)` : 'Escáner Óptico LPR', icon: 'login' },
            { id: 'salida-y-cobro', label: 'Salida y Cobro', sub: 'Liquidación Taquilla', icon: 'point_of_sale' },
          ];
        }
        // Administrador gets all!
        return [
          { id: 'panel-operativo', label: 'Panel Operativo', sub: pendingCount > 0 ? `🔔 ${pendingCount} Solicitudes` : 'HUD Telemetría 3D', icon: 'grid_view' },
          { id: 'portal-cliente', label: 'Portal Cliente', sub: 'Vista Conductor', icon: 'person' },
          { id: 'registro-de-entrada', label: 'Registro Entrada', sub: pendingCount > 0 ? `(${pendingCount} Pendientes)` : 'Escáner Óptico LPR', icon: 'login' },
          { id: 'salida-y-cobro', label: 'Salida y Cobro', sub: 'Liquidación Quantum', icon: 'point_of_sale' },
          { id: 'tarifas-y-celdas', label: 'Tarifas y Celdas', sub: 'Matrices de Control', icon: 'tune' },
          { id: 'reportes-y-auditoria', label: 'Reportes', sub: 'Ledger Blockchain', icon: 'analytics' },
        ];
      };

      return (
        <div className="min-h-screen flex text-slate-100 relative">
          
          {/* ── SIDEBAR ── */}
          <aside className="fixed left-0 top-0 h-full w-64 z-40 flex flex-col border-r border-cyan-500/20" style={{ background: 'linear-gradient(180deg, rgba(2,5,16,0.98) 0%, rgba(4,8,24,0.99) 100%)' }}>
            <div className="p-5 border-b border-cyan-500/20 flex items-center gap-3">
              <div className="w-10 h-10 rounded-xl bg-cyan-500/20 border border-cyan-400 flex items-center justify-center text-cyan-300 shadow-[0_0_15px_rgba(0,240,255,0.4)]">
                <span className="material-symbols-outlined text-[24px]">electric_bolt</span>
              </div>
              <div>
                <div className="font-hud text-base font-black text-cyan-300 tracking-wider">PARKFLOW</div>
                <div className="font-mono text-[9px] text-slate-500 flex items-center gap-1 mt-0.5">
                  <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse" />
                  TELEMETRY OS 2099
                </div>
              </div>
            </div>

            {/* Role Indicator Banner in Sidebar */}
            <div className="px-4 py-2.5 border-b border-cyan-500/15 flex items-center justify-between font-mono text-xs" style={{ background: 'rgba(0,240,255,0.04)' }}>
              <span className="text-slate-400 text-[10px] uppercase">Rol Activo:</span>
              <span className={`px-2 py-0.5 rounded text-[10px] font-hud font-bold border ${
                userRole === 'cliente' ? 'bg-emerald-500/15 border-emerald-400 text-emerald-300' :
                userRole === 'operador' ? 'bg-violet-500/15 border-violet-400 text-violet-300' :
                'bg-cyan-500/15 border-cyan-400 text-cyan-300'
              }`}>
                {userRole ? userRole.toUpperCase() : 'SELECCIONAR'}
              </span>
            </div>

            <div className="px-4 py-2 border-b border-cyan-500/15 flex items-center justify-between font-mono text-xs">
              <span className="text-cyan-400 font-bold tracking-widest">{time.toLocaleTimeString()}</span>
              <span className="px-2 py-0.5 rounded bg-cyan-500/10 text-cyan-300 border border-cyan-500/30 text-[9px] font-bold">SQL LIVE</span>
            </div>

            {/* Radar Occupancy Module */}
            <div className="p-4">
              <div className="p-3.5 rounded-xl border border-cyan-500/30 hud-corners" style={{ background: 'rgba(0,20,40,0.5)' }}>
                <div className="flex items-center justify-between text-[10px] font-hud text-cyan-300 font-bold mb-1">
                  <span>ESTADO DE AFORO</span>
                  <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse" />
                </div>
                <div className="flex items-baseline gap-1 my-1">
                  <span className="font-hud text-3xl font-black text-cyan-300 glow-text-cyan">{currentOccupancy}</span>
                  <span className="font-hud text-sm text-cyan-500">%</span>
                  <span className="font-mono text-[10px] text-slate-500 ml-auto">{occupiedCount}/{totalCells}</span>
                </div>
                <div className="w-full bg-black/60 rounded-full h-2 overflow-hidden border border-cyan-500/30">
                  <div className="h-full bg-gradient-to-r from-cyan-400 to-emerald-400" style={{ width: `${currentOccupancy}%` }} />
                </div>
              </div>
            </div>

            {/* Dynamic Nav Menu filtered by Role */}
            <nav className="flex flex-col gap-1.5 px-3 flex-1 overflow-y-auto">
              {getNavItems().map(item => (
                <button
                  key={item.id}
                  onClick={() => handleNav(item.id)}
                  className={`flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-left transition-all ${
                    activeView === item.id
                      ? 'bg-cyan-500/20 border border-cyan-400 text-cyan-200 shadow-[0_0_15px_rgba(0,240,255,0.3)]'
                      : 'text-slate-400 hover:text-white hover:bg-white/5 border border-transparent'
                  }`}
                >
                  <span className="material-symbols-outlined text-[20px]">{item.icon}</span>
                  <div className="flex flex-col leading-tight">
                    <span className="font-hud text-[11px] font-bold">{item.label}</span>
                    <span className="font-mono text-[9px] text-slate-500">{item.sub}</span>
                  </div>
                </button>
              ))}
              {userRole === 'cliente' && (
                <div className="mt-3 p-3 rounded-xl border border-emerald-500/30 bg-emerald-950/25 text-[10px] font-mono">
                  <div className="flex items-center gap-1.5 text-emerald-400 font-bold mb-1">
                    <span className="material-symbols-outlined text-[15px]">verified_user</span>
                    <span>PERFIL PROTEGIDO</span>
                  </div>
                  <p className="text-[9px] text-slate-400 leading-tight">
                    Acceso de conductor aislado de la red interna de taquillas, cobros y servidores.
                  </p>
                </div>
              )}
            </nav>

            {/* Bottom Role Switch & Logout Buttons */}
            <div className="p-3 border-t border-cyan-500/20 flex flex-col gap-2">
              <button
                onClick={() => { playCyberAudio('click'); setShowRoleModal(true); }}
                className="w-full py-2 px-3 rounded-xl font-hud text-[10px] font-bold tracking-wider text-slate-300 hover:text-white bg-white/5 hover:bg-cyan-500/20 border border-white/10 hover:border-cyan-400 transition-all flex items-center justify-center gap-2 cursor-pointer"
              >
                <span className="material-symbols-outlined text-[16px] text-cyan-400">switch_account</span>
                <span>CAMBIAR DE ROL</span>
              </button>

              {currentUser && (
                <button
                  onClick={handleLogout}
                  className="w-full py-2 px-3 rounded-xl font-hud text-[10px] font-bold tracking-wider text-rose-300 hover:text-white bg-rose-500/10 hover:bg-rose-500/20 border border-rose-500/20 hover:border-rose-400 transition-all flex items-center justify-center gap-2 cursor-pointer"
                >
                  <span className="material-symbols-outlined text-[16px] text-rose-400">logout</span>
                  <span>CERRAR SESIÓN</span>
                </button>
              )}
            </div>
          </aside>

          {/* ── TOP HEADER ── */}
          <header className="fixed top-0 left-64 right-0 h-16 z-30 flex items-center justify-between px-6 border-b border-cyan-500/20 backdrop-blur-md" style={{ background: 'rgba(2,5,16,0.95)' }}>
            <div className="flex items-center gap-3">
              {userRole === 'cliente' ? (
                <div className="flex items-center gap-2 px-3 py-1 rounded-full text-[10px] font-mono font-bold border border-emerald-500/40 bg-emerald-500/10 text-emerald-300 shadow-[0_0_12px_rgba(0,255,157,0.2)]">
                  <span className="material-symbols-outlined text-[14px]">verified_user</span>
                  <span>ZONA CLIENTE SEGURA // AISLADA</span>
                </div>
              ) : (
                <div className="flex items-center gap-2 px-3 py-1 rounded-full text-[10px] font-hud font-bold border border-emerald-500/40 bg-emerald-500/10 text-emerald-300 shadow-[0_0_12px_rgba(0,255,157,0.2)]">
                  <span className="w-2 h-2 rounded-full bg-emerald-400 animate-ping" />
                  <span>SISTEMA NOMINAL</span>
                </div>
              )}
            </div>

            {/* Top Right: User Profile & Actions */}
            <div className="flex items-center gap-3">
              {currentUser && (
                <div className={`flex items-center gap-2.5 px-3 py-1.5 rounded-xl border font-mono text-xs ${
                  userRole === 'cliente' ? 'bg-emerald-500/10 border-emerald-500/30 text-emerald-300' :
                  userRole === 'operador' ? 'bg-violet-500/10 border-violet-500/30 text-violet-300' :
                  'bg-cyan-500/10 border-cyan-500/30 text-cyan-300'
                }`}>
                  <span className="material-symbols-outlined text-[18px]">
                    {userRole === 'cliente' ? 'directions_car' : userRole === 'operador' ? 'badge' : 'admin_panel_settings'}
                  </span>
                  <div className="flex flex-col text-left leading-tight">
                    <span className="font-hud text-[11px] font-bold text-white">{currentUser.name}</span>
                    <span className="text-[9px] opacity-80">
                      {userRole === 'cliente' ? `CC: ${currentUser.id} · ${currentUser.plate}` :
                       userRole === 'operador' ? `${currentUser.badge} · ${currentUser.shift?.split(' ')[1] || 'Turno'}` :
                       'ROOT // MASTER'}
                    </span>
                  </div>
                </div>
              )}

              <button
                type="button"
                onClick={() => { playCyberAudio('click'); setShowRoleModal(true); }}
                className="px-3 py-1.5 rounded-xl font-hud text-[10px] font-bold text-slate-300 hover:text-white bg-white/5 hover:bg-cyan-500/20 border border-white/10 hover:border-cyan-400 transition-all flex items-center gap-1.5 cursor-pointer"
                title="Cambiar de Rol"
              >
                <span className="material-symbols-outlined text-[15px] text-cyan-400">switch_account</span>
                <span className="hidden sm:inline">CAMBIAR ROL</span>
              </button>

              <button
                type="button"
                onClick={handleLogout}
                className="px-3 py-1.5 rounded-xl font-hud text-[10px] font-bold text-rose-300 hover:text-white bg-rose-500/10 hover:bg-rose-500/25 border border-rose-500/30 hover:border-rose-400 transition-all flex items-center gap-1.5 cursor-pointer"

                                ¿Ya te has registrado antes? Inicia sesión aquí con tu cédula
                              </button>
                            </div>
                          </form>
                        )}
                      </div>
                    )}

                    {/* ══════════════════════════════════════════════════════════════ */}
                    {/* CASO 2: OPERADOR DE TURNO (CUENTA AUTORIZADA & CLAVE ÚNICA) */}
                    {/* ══════════════════════════════════════════════════════════════ */}
                    {selectedRoleForAuth === 'operador' && (
                      <form onSubmit={(e) => handleRoleLogin(e, 'operador')} className="flex flex-col gap-4">
                        <div className="p-4 rounded-xl border border-violet-500/30 bg-violet-950/20 flex items-start gap-3">
                          <span className="material-symbols-outlined text-violet-400 text-[26px]">badge</span>
                          <div>
                            <div className="font-hud text-sm font-bold text-white">ACREDITACIÓN DE OPERADOR DE TAQUILLA // ROL EXCLUSIVO</div>
                            <p className="font-mono text-xs text-slate-400 mt-0.5">
                              Acceso reservado para el personal autorizado del parqueadero. Nadie puede ingresar sin una cuenta activa acreditada para el rol de Operador.
                            </p>
                          </div>
                        </div>

                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                          <div>
                            <label className="block font-mono text-xs text-slate-400 mb-1 font-bold">Código de Carnet / ID Operador:</label>
                            <input
                              type="text"
                              required
                              placeholder="Ej. OP-418"
                              value={opAuthBadge}
                              onChange={e => setOpAuthBadge(e.target.value.toUpperCase())}
                              className="w-full h-12 rounded-xl px-4 font-mono text-base font-bold text-cyan-300 bg-black/60 border border-violet-500/40 focus:outline-none focus:border-violet-400"
                            />
                          </div>
                          <div>
                            <label className="block font-mono text-xs text-slate-400 mb-1 font-bold flex justify-between items-center">
                              <span>Contraseña / PIN Único de Operador:</span>
                              <button
                                type="button"
                                onClick={() => setShowPassword(!showPassword)}
                                className="text-[10px] text-violet-400 hover:text-violet-300 cursor-pointer flex items-center gap-1"
                              >
                                <span className="material-symbols-outlined text-[14px]">{showPassword ? 'visibility_off' : 'visibility'}</span>
                                <span>{showPassword ? 'Ocultar' : 'Mostrar'}</span>
                              </button>
                            </label>
                            <input
                              type={showPassword ? 'text' : 'password'}
                              required
                              placeholder="••••••••"
                              value={opAuthPin}
                              onChange={e => setOpAuthPin(e.target.value)}
                              className="w-full h-12 rounded-xl px-4 font-mono text-base text-violet-300 bg-black/60 border border-violet-500/40 focus:outline-none focus:border-violet-400 tracking-wider"
                            />
                          </div>
                          <div className="sm:col-span-2">
                            <label className="block font-mono text-xs text-slate-400 mb-1 font-bold">Turno de Operación Asignado:</label>
                            <select
                              value={opAuthShift}
                              onChange={e => setOpAuthShift(e.target.value)}
                              className="w-full h-12 rounded-xl px-4 font-mono text-xs font-bold text-white bg-black/60 border border-violet-500/40 focus:outline-none focus:border-violet-400"
                            >
                              <option value="Turno Mañana [06:00 - 14:00]">Turno Mañana [06:00 - 14:00]</option>
                              <option value="Turno Tarde [14:00 - 22:00]">Turno Tarde [14:00 - 22:00]</option>
                              <option value="Turno Noche [22:00 - 06:00]">Turno Noche [22:00 - 06:00]</option>
                            </select>
                          </div>
                        </div>

                        <div className="flex flex-col sm:flex-row items-center justify-between gap-3 pt-2">
                          <button
                            type="button"
                            onClick={() => fillDemoCredentials('operador')}
                            className="px-3.5 py-2 rounded-xl font-mono text-xs text-violet-400 bg-violet-500/10 border border-violet-500/30 hover:bg-violet-500/20 cursor-pointer flex items-center gap-1.5"
                          >
                            <span className="material-symbols-outlined text-[16px]">bolt</span>
                            <span>Cargar Credencial Autorizada: Carlos Rojas (OP-418)</span>
                          </button>

                          <button
                            type="submit"
                            disabled={isAuthSubmitting}
                            className="w-full sm:w-auto px-8 py-3 rounded-xl font-hud text-xs font-black tracking-wider cyber-btn-violet cursor-pointer shadow-[0_0_20px_rgba(139,92,246,0.3)] disabled:opacity-50"
                          >
                            {isAuthSubmitting ? 'VERIFICANDO...' : 'INICIAR TURNO DE OPERADOR'}
                          </button>
                        </div>
                      </form>
                    )}

                    {/* ══════════════════════════════════════════════════════════════ */}
                    {/* CASO 3: ADMINISTRADOR GLOBAL (ROOT MASTER // NIVEL 4) */}
                    {/* ══════════════════════════════════════════════════════════════ */}
                    {selectedRoleForAuth === 'administrador' && (
                      <form onSubmit={(e) => handleRoleLogin(e, 'administrador')} className="flex flex-col gap-4">
                        <div className="p-4 rounded-xl border border-cyan-500/30 bg-cyan-950/20 flex items-start gap-3">
                          <span className="material-symbols-outlined text-cyan-400 text-[26px]">admin_panel_settings</span>
                          <div>
                            <div className="font-hud text-sm font-bold text-white">AUTORIZACIÓN DE SUPERUSUARIO MASTER (NIVEL 4)</div>
                            <p className="font-mono text-xs text-slate-400 mt-0.5">
                              Nadie puede ingresar como administrador sin una cuenta autorizada con este rol. Otorga control irrestricto sobre políticas de tarifas, telemetría y auditoría en MySQL.
                            </p>
                          </div>
                        </div>

                        <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                          <div>
                            <label className="block font-mono text-xs text-slate-400 mb-1 font-bold">Usuario Administrador:</label>
                            <input
                              type="text"
                              required
                              placeholder="admin.master"
                              value={adminAuthUser}
                              onChange={e => setAdminAuthUser(e.target.value)}
                              className="w-full h-12 rounded-xl px-4 font-mono text-base font-bold text-cyan-300 bg-black/60 border border-cyan-500/40 focus:outline-none focus:border-cyan-400"
                            />
                          </div>
                          <div>
                            <label className="block font-mono text-xs text-slate-400 mb-1 font-bold flex justify-between items-center">
                              <span>Llave Cuántica / Clave:</span>
                              <button
                                type="button"
                                onClick={() => setShowPassword(!showPassword)}
                                className="text-[10px] text-cyan-400 hover:text-cyan-300 cursor-pointer flex items-center gap-1"
                              >
                                <span className="material-symbols-outlined text-[14px]">{showPassword ? 'visibility_off' : 'visibility'}</span>
                                <span>{showPassword ? 'Ocultar' : 'Mostrar'}</span>
                              </button>
                            </label>
                            <input
                              type={showPassword ? 'text' : 'password'}
                              required
                              placeholder="••••••••••••"
                              value={adminAuthKey}
                              onChange={e => setAdminAuthKey(e.target.value)}
                              className="w-full h-12 rounded-xl px-4 font-mono text-base text-cyan-300 bg-black/60 border border-cyan-500/40 focus:outline-none focus:border-cyan-400 tracking-wider"
                            />
                          </div>
                          <div>
                            <label className="block font-mono text-xs text-slate-400 mb-1 font-bold">Token 2FA OTP:</label>
                            <input
                              type="text"
                              placeholder="892-411"
                              value={adminAuthOtp}
                              onChange={e => setAdminAuthOtp(e.target.value)}
                              className="w-full h-12 rounded-xl px-4 font-mono text-base font-bold text-emerald-400 bg-black/60 border border-cyan-500/40 focus:outline-none focus:border-cyan-400 text-center tracking-widest"
                            />
                          </div>
                        </div>

                        <div className="flex flex-col sm:flex-row items-center justify-between gap-3 pt-2">
                          <button
                            type="button"
                            onClick={() => fillDemoCredentials('administrador')}
                            className="px-3.5 py-2 rounded-xl font-mono text-xs text-cyan-400 bg-cyan-500/10 border border-cyan-500/30 hover:bg-cyan-500/20 cursor-pointer flex items-center gap-1.5"
                          >
                            <span className="material-symbols-outlined text-[16px]">bolt</span>
                            <span>Cargar Acceso Superuser (Ing. Valderrama)</span>
                          </button>

                          <button
                            type="submit"
                            disabled={isAuthSubmitting}
                            className="w-full sm:w-auto px-8 py-3 rounded-xl font-hud text-xs font-black tracking-wider cyber-btn-cyan cursor-pointer shadow-[0_0_20px_rgba(0,240,255,0.3)] disabled:opacity-50"
                          >
                            {isAuthSubmitting ? 'AUTORIZANDO...' : 'AUTORIZAR ACCESO MAESTRO'}
                          </button>
                        </div>
                      </form>
                    )}
                  </div>
                )}
              </div>
            </div>
          )}

          {/* ── CELL INSPECTION MODAL (TELEMETRÍA EN VIVO DE BAHÍA) ── */}
          {selectedCell && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md animate-fadeIn">
              <div className="p-6 rounded-3xl border border-cyan-500/40 max-w-lg w-full relative overflow-hidden" style={{
                background: 'linear-gradient(160deg, rgba(8,16,44,0.98) 0%, rgba(3,7,20,0.99) 100%)',
                boxShadow: '0 0 50px rgba(0,240,255,0.25)',
              }}>
                <div className="flex justify-between items-start pb-3 border-b border-cyan-500/20">
                  <div>
                    <div className="flex items-center gap-2">
                      <span className="font-hud text-xl font-black text-white">{selectedCell.id}</span>
                      <span className="px-2 py-0.5 rounded text-[10px] font-mono font-bold bg-cyan-500/20 text-cyan-300 border border-cyan-500/40">
                        {selectedCell.zone} · {selectedCell.category}
                      </span>
                      {selectedCell.isClientAutoOccupied && (
                        <span className="px-2 py-0.5 rounded text-[10px] font-mono font-bold bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 animate-pulse">
                          AUTO-TICKET CLIENTE
                        </span>
                      )}
                    </div>
                    <span className="text-xs font-mono text-slate-400 mt-1 block">Telemetría de la Bahía en Tiempo Real</span>
                  </div>
                  <button
                    onClick={() => setSelectedCell(null)}
                    className="text-slate-400 hover:text-white font-bold text-lg p-1 cursor-pointer"
                  >
                    ✕
                  </button>
                </div>

                <div className="flex flex-col gap-3 py-4 font-mono text-xs">
                  <div className="flex justify-between p-2.5 rounded-lg bg-black/50 border border-white/10">
                    <span className="text-slate-400">Estado de Bahía:</span>
                    <strong className={
                      selectedCell.isPendingApproval || selectedCell.status === 'reserved'
                        ? 'text-amber-400 font-bold animate-pulse'
                        : selectedCell.status === 'occupied'
                        ? 'text-rose-400 font-bold'
                        : selectedCell.status === 'blocked'
                        ? 'text-amber-400 font-bold'
                        : 'text-emerald-400 font-bold'
                    }>
                      {selectedCell.isPendingApproval || selectedCell.status === 'reserved'
                        ? 'SOLICITUD PENDIENTE DE APROBACIÓN'
                        : selectedCell.status === 'occupied'
                        ? 'OCUPADO'
                        : selectedCell.status === 'blocked'
                        ? 'EN MANTENIMIENTO'
                        : 'DISPONIBLE'}
                    </strong>
                  </div>

                  {(selectedCell.isPendingApproval || selectedCell.status === 'reserved') && (
                    <div className="p-3.5 rounded-xl bg-amber-950/40 border border-amber-500/40 flex flex-col gap-2">
                      <div className="flex justify-between">
                        <span className="text-slate-400">Placa Solicitada:</span>
                        <strong className="text-yellow-300 font-hud text-base tracking-widest">{selectedCell.plate}</strong>
                      </div>
                      <div className="flex justify-between">
                        <span className="text-slate-400">Cliente Solicitante:</span>
                        <strong className="text-white">{selectedCell.driverName || 'Cliente Web'} {selectedCell.driverDoc ? `(CC: ${selectedCell.driverDoc})` : ''}</strong>
                      </div>
                      {selectedCell.driverPhone && (
                        <div className="flex justify-between">
                          <span className="text-slate-400">Teléfono:</span>
                          <strong className="text-cyan-300">{selectedCell.driverPhone}</strong>
                        </div>
                      )}
                      <div className="flex justify-between">
                        <span className="text-slate-400">Hora de Solicitud:</span>
                        <span className="text-white">{selectedCell.requestTime || 'Reciente'}</span>
                      </div>
                      <div className="flex justify-between">
                        <span className="text-slate-400">Tarifa a Aplicar:</span>
                        <strong className="text-emerald-400">${selectedCell.ratePerHour?.toLocaleString('es-CO') || '4.500'} COP / h</strong>
                      </div>
                      <div className="p-2 rounded bg-amber-500/10 border border-amber-500/30 text-[11px] text-amber-200 mt-1">
                        El cliente no ocupará la bahía hasta que el operador presione <strong>Aceptar</strong>. Al aceptar, iniciará el conteo de permanencia y se habilitará el paso.
                      </div>
                    </div>
                  )}

                  {selectedCell.status === 'occupied' && (
                    <>
                      <div className="flex justify-between p-2.5 rounded-lg bg-black/50 border border-white/10">
                        <span className="text-slate-400">Matrícula / Placa:</span>
                        <strong className="text-yellow-300 font-hud text-base tracking-widest">{selectedCell.plate}</strong>
                      </div>

                      {selectedCell.driverName && (
                        <div className="flex justify-between p-2.5 rounded-lg bg-black/50 border border-white/10">
                          <span className="text-slate-400">Conductor / Cliente:</span>
                          <strong className="text-white font-bold">{selectedCell.driverName} {selectedCell.driverDoc ? `(CC: ${selectedCell.driverDoc})` : ''}</strong>
                        </div>
                      )}

                      {selectedCell.ticketId && (
                        <div className="flex justify-between p-2.5 rounded-lg bg-black/50 border border-white/10">
                          <span className="text-slate-400">Ticket Digital Emitido:</span>
                          <strong className="text-cyan-300">{selectedCell.ticketId}</strong>
                        </div>
                      )}

                      <div className="flex justify-between p-2.5 rounded-lg bg-black/50 border border-white/10">
                        <span className="text-slate-400">Hora de Ingreso:</span>
                        <span className="text-slate-200">{selectedCell.entryTime || '11:15 AM'}</span>
                      </div>

                      <div className="flex justify-between p-2.5 rounded-lg bg-black/50 border border-white/10">
                        <span className="text-slate-400">Permanencia en Patio:</span>
                        <span className="text-cyan-300 font-bold font-mono">{cells.find(c => c.id === selectedCell.id)?.duration || selectedCell.duration || '0h 00m 00s'}</span>
                      </div>

                      <div className="flex justify-between p-2.5 rounded-lg bg-black/50 border border-white/10">
                        <span className="text-slate-400">Monto Liquidado al Momento:</span>
                        <span className="text-emerald-400 font-bold text-sm">${selectedCell.currentTotal?.toLocaleString('es-CO') || selectedCell.ratePerHour?.toLocaleString('es-CO') || '4.500'} COP</span>
                      </div>
                    </>
                  )}
                </div>

                <div className="flex flex-wrap items-center justify-end gap-2 pt-3 border-t border-cyan-500/20">
                  {(selectedCell.isPendingApproval || selectedCell.status === 'reserved') && (
                    <>
                      <button
                        type="button"
                        onClick={() => handleApproveClientRequest(selectedCell.id)}
                        className="px-4 py-2 rounded-xl font-hud text-xs font-black bg-emerald-500/25 hover:bg-emerald-500/40 text-emerald-300 border border-emerald-400/60 shadow-[0_0_15px_rgba(16,185,129,0.3)] cursor-pointer flex items-center gap-1.5"
                      >
                        <span className="material-symbols-outlined text-[16px]">check_circle</span>
                        ACEPTAR Y ASIGNAR BAHÍA
                      </button>
                      <button
                        type="button"
                        onClick={() => handleRejectClientRequest(selectedCell.id)}
                        className="px-4 py-2 rounded-xl font-hud text-xs font-bold bg-rose-500/20 hover:bg-rose-500/30 text-rose-300 border border-rose-500/40 cursor-pointer flex items-center gap-1.5"
                      >
                        <span className="material-symbols-outlined text-[16px]">cancel</span>
                        RECHAZAR SOLICITUD
                      </button>
                    </>
                  )}
                  {selectedCell.status === 'occupied' && (
                    <button
                      type="button"
                      onClick={() => {
                        playCyberAudio('checkout');
                        const updated = cells.map(c => c.id === selectedCell.id ? { ...c, status: 'free', plate: undefined, driverName: undefined, isClientAutoOccupied: undefined } : c);
                        setCells(updated);
                        try { localStorage.setItem('parkflow_cells', JSON.stringify(updated)); } catch(e) {}
                        showToast(`Bahía ${selectedCell.id} liberada manualmente`, 'success');
                        setSelectedCell(null);
                      }}
                      className="px-4 py-2 rounded-xl font-mono text-xs font-bold bg-rose-500/20 text-rose-300 border border-rose-500/40 hover:bg-rose-500/30 cursor-pointer"
                    >
                      LIBERAR BAHÍA MANUALMENTE
                    </button>
                  )}
                  <button
                    type="button"
                    onClick={() => setSelectedCell(null)}
                    className="px-5 py-2 rounded-xl font-mono text-xs font-bold cyber-btn-cyan cursor-pointer"
                  >
                    Cerrar
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ── XAMPP MODAL ── */}
          {isXamppOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md">
              <div className="p-6 rounded-2xl border border-cyan-500/40 max-w-lg w-full" style={{ background: 'linear-gradient(160deg, rgba(8,16,44,0.98) 0%, rgba(3,7,20,0.99) 100%)' }}>
                <div className="flex justify-between items-center mb-4 pb-2 border-b border-cyan-500/20">
                  <div className="font-hud text-sm font-bold text-cyan-300">TELEMETRÍA XAMPP & MYSQL</div>
                  <button onClick={() => setIsXamppOpen(false)} className="text-slate-400 hover:text-white cursor-pointer font-bold">✕</button>
                </div>
                <div className="font-mono text-xs space-y-2 text-slate-300">
                  <div className="flex justify-between"><span>Apache Web Engine:</span><strong className="text-emerald-400">PORT 80 (ACTIVE)</strong></div>
                  <div className="flex justify-between"><span>MySQL Relational Core:</span><strong className="text-cyan-400">PORT 3306 (LIVE)</strong></div>
                  <div className="flex justify-between"><span>Database Name:</span><strong className="text-white">parkflow_db</strong></div>
                  <div className="p-3 rounded-lg bg-black/70 border border-cyan-500/20 text-[11px] text-cyan-400/80 mt-3">
                    [SQL_NET] Ping localhost:3306 ... ACK 200 OK<br/>
                    [STATUS] 50 celdas vinculadas con PHP API en htdocs.
                  </div>
                </div>
                <div className="mt-5 flex justify-end gap-2">
                  <button onClick={() => setIsXamppOpen(false)} className="px-4 py-2 rounded-xl font-mono text-xs font-bold cyber-btn-cyan cursor-pointer">Cerrar</button>
                </div>
              </div>
            </div>
          )}

          {/* ── TOAST NOTIFICATION ── */}
          {toast && (
            <div className="fixed bottom-6 right-6 z-50 p-4 rounded-xl border border-cyan-500/40 bg-black/90 text-cyan-300 font-mono text-xs flex items-center gap-2 shadow-[0_0_20px_rgba(0,240,255,0.4)]">
              <span className="material-symbols-outlined text-[18px]">verified</span>
              <span>{toast.msg}</span>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
