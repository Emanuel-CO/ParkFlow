<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ParkFlow 2099 // Smart Parking Telemetry OS</title>
    <meta name="description" content="Sistema operativo inteligente de gestión y control de parqueadero con telemetría en tiempo real, HUD futurista y persistencia en MySQL." />
    <meta property="og:title" content="ParkFlow 2099 // Smart Parking Telemetry OS" />
    <meta property="og:description" content="Sistema operativo inteligente de gestión de parqueadero con telemetría en tiempo real, interfaz futurista y sincronización XAMPP." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#020510" />

    <!-- Google Fonts: Orbitron, Rajdhani, JetBrains Mono, Inter, Chakra Petch -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700;800&family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    
    <style>
      /* Prevent FOUC */
      html { background: #020510; }
      body { margin: 0; }

      /* Global ambient background */
      body::before {
        content: '';
        position: fixed;
        inset: 0;
        background: 
          radial-gradient(ellipse 80% 60% at 10% 0%, rgba(0, 240, 255, 0.04) 0%, transparent 60%),
          radial-gradient(ellipse 60% 50% at 90% 100%, rgba(139, 92, 246, 0.05) 0%, transparent 60%),
          radial-gradient(ellipse 50% 40% at 50% 50%, rgba(0, 20, 60, 0.5) 0%, transparent 80%);
        pointer-events: none;
        z-index: 0;
      }
      body::after {
        content: '';
        position: fixed;
        inset: 0;
        background-image: 
          linear-gradient(rgba(0, 240, 255, 0.018) 1px, transparent 1px),
          linear-gradient(90deg, rgba(0, 240, 255, 0.018) 1px, transparent 1px);
        background-size: 48px 48px;
        pointer-events: none;
        z-index: 0;
      }
      #root {
        position: relative;
        z-index: 1;
      }
    </style>
  </head>
  <body class="bg-[#020510] font-sans text-on-surface antialiased overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
