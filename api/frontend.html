  <style>
    html { background: #020510; color: #f1f5f9; }
    body { margin: 0; background: #020510; font-family: 'Inter', sans-serif; overflow-x: hidden; }

    /* Ambient radial glow backdrop */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: 
        radial-gradient(ellipse 80% 60% at 10% 0%, rgba(0, 240, 255, 0.05) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 90% 100%, rgba(139, 92, 246, 0.06) 0%, transparent 60%),
        radial-gradient(ellipse 50% 40% at 50% 50%, rgba(0, 20, 60, 0.4) 0%, transparent 80%);
      pointer-events: none;
      z-index: 0;
    }
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image: 
        linear-gradient(rgba(0, 240, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 240, 255, 0.02) 1px, transparent 1px);

      pointer-events: none;

    /* Neon Glows */

    .glow-cyan-sm { box-shadow: 0 0 10px rgba(0, 240, 255, 0.35); }
    .glow-emerald { box-shadow: 0 0 20px rgba(0, 255, 157, 0.5); }
    .glow-red { box-shadow: 0 0 20px rgba(255, 42, 109, 0.6); }
    .glow-amber { box-shadow: 0 0 20px rgba(255, 183, 3, 0.5); }
    .glow-text-cyan { text-shadow: 0 0 20px rgba(0, 240, 255, 0.8), 0 0 40px rgba(0, 240, 255, 0.4); }
    .glow-text-emerald { text-shadow: 0 0 20px rgba(0, 255, 157, 0.8), 0 0 40px rgba(0, 255, 157, 0.4); }
    .glow-text-red { text-shadow: 0 0 20px rgba(255, 42, 109, 0.8); }

    /* Scanlines */
    .scanline-bg {

                        linear-gradient(90deg, rgba(0, 240, 255, 0.025) 1px, transparent 1px);

    }

    /* HUD Corner Accents */
    .hud-corners { position: relative; }
    .hud-corners::before {
      content: '';

      top: -1px; left: -1px;

    /* Plate Bezel */

    /* Laser Reticle */

    /* Cyber Buttons */

    /* Cyber Range */
    .cyber-range {

    @keyframes audio-wave-2 { 0%, 100% { height: 18px; } 50% { height: 8px; } }

    .audio-bar-2 { animation: audio-wave-2 0.5s ease-in-out infinite 0.1s; }
    .audio-bar-3 { animation: audio-wave-3 0.65s ease-in-out infinite 0.2s; }

    ::-webkit-scrollbar { width: 6px; height: 6px; }

<body class="bg-[#020510] font-sans text-slate-100 antialiased">
  <div id="root"></div>

  <!-- APPLICATION SCRIPT (BABEL COMPILATION) -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    // Web Audio Synthesizer
    let audioCtx = null;
    function playCyberAudio(type = 'click') {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const now = audioCtx.currentTime;
        const master = audioCtx.createGain();
        master.gain.setValueAtTime(0.2, now);
        master.connect(audioCtx.destination);

        if (type === 'click') {
          const osc = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(1400, now);
          osc.frequency.exponentialRampToValueAtTime(700, now + 0.04);
          g.gain.setValueAtTime(0.3, now);
          g.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
          osc.connect(g); g.connect(master);
          osc.start(now); osc.stop(now + 0.05);
        } else if (type === 'laser') {
          const osc = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(2400, now);
          osc.frequency.exponentialRampToValueAtTime(300, now + 0.12);
          g.gain.setValueAtTime(0.25, now);
          g.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
          osc.connect(g); g.connect(master);
          osc.start(now); osc.stop(now + 0.13);
        } else if (type === 'checkout') {
          [0, 0.08, 0.16].forEach((d, idx) => {
            const osc = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            const notes = [523.25, 659.25, 1046.5];
            osc.frequency.setValueAtTime(notes[idx], now + d);
            g.gain.setValueAtTime(0, now + d);
            g.gain.linearRampToValueAtTime(0.4, now + d + 0.02);
            g.gain.exponentialRampToValueAtTime(0.001, now + d + 0.25);
            osc.connect(g); g.connect(master);
            osc.start(now + d); osc.stop(now + d + 0.28);
          });
        }
      } catch (e) {}
    }

    // Initial cells mock
    const initialCells = [
      { id: 'A-01', zone: 'Zona A', category: 'Carro', status: 'occupied', plate: 'KLO-892', entryTime: '08:30 AM', duration: '3h 15m', ratePerHour: 4500, currentTotal: 14625 },
      { id: 'A-02', zone: 'Zona A', category: 'Carro', status: 'free', ratePerHour: 4500 },
      { id: 'A-03', zone: 'Zona A', category: 'Carro', status: 'occupied', plate: 'NVY-402', entryTime: '10:15 AM', duration: '1h 30m', ratePerHour: 4500, currentTotal: 9000 },
      { id: 'A-04', zone: 'Zona A', category: 'Carro', status: 'occupied', plate: 'TRK-219', entryTime: '09:00 AM', duration: '2h 45m', ratePerHour: 4500, currentTotal: 13500 },
      { id: 'A-05', zone: 'Zona A', category: 'Carro', status: 'blocked', maintenanceReason: 'Sensor Óptico', ratePerHour: 4500 },
      { id: 'A-06', zone: 'Zona A', category: 'Carro', status: 'free', ratePerHour: 4500 },
      { id: 'A-07', zone: 'Zona A', category: 'Carro', status: 'free', ratePerHour: 4500 },
      { id: 'A-08', zone: 'Zona A', category: 'Carro', status: 'occupied', plate: 'MKZ-771', entryTime: '11:10 AM', duration: '0h 35m', ratePerHour: 4500, currentTotal: 4500 },
      { id: 'A-09', zone: 'Zona A', category: 'Carro', status: 'free', ratePerHour: 4500 },
      { id: 'A-10', zone: 'Zona A', category: 'Carro', status: 'free', ratePerHour: 4500 },
      { id: 'B-01', zone: 'Zona B', category: 'Moto', status: 'occupied', plate: 'MTR-411', entryTime: '08:45 AM', duration: '3h 00m', ratePerHour: 2200, currentTotal: 6600 },
      { id: 'B-02', zone: 'Zona B', category: 'Moto', status: 'free', ratePerHour: 2200 },
      { id: 'B-03', zone: 'Zona B', category: 'Moto', status: 'occupied', plate: 'XYZ-908', entryTime: '09:30 AM', duration: '2h 15m', ratePerHour: 2200, currentTotal: 4950 },
      { id: 'B-04', zone: 'Zona B', category: 'Moto', status: 'free', ratePerHour: 2200 },
      { id: 'B-05', zone: 'Zona B', category: 'Moto', status: 'free', ratePerHour: 2200 },
    ];

    function App() {
      // Role & User Identity State
      const [userRole, setUserRole] = useState(null);
      const [currentUser, setCurrentUser] = useState(null);
      const [showRoleModal, setShowRoleModal] = useState(true);
      const [selectedRoleForAuth, setSelectedRoleForAuth] = useState(null);

      // Auth Inputs for Cliente
      const [clientAuthDoc, setClientAuthDoc] = useState('');
      const [clientAuthName, setClientAuthName] = useState('');
      const [clientAuthPlate, setClientAuthPlate] = useState('');
      const [clientAuthPhone, setClientAuthPhone] = useState('');

      // Auth Inputs for Operador
      const [opAuthBadge, setOpAuthBadge] = useState('');
      const [opAuthName, setOpAuthName] = useState('');
      const [opAuthPin, setOpAuthPin] = useState('');
      const [opAuthShift, setOpAuthShift] = useState('Turno Mañana [06:00 - 14:00]');

      // Auth Inputs for Administrador
      const [adminAuthUser, setAdminAuthUser] = useState('');
      const [adminAuthKey, setAdminAuthKey] = useState('');
      const [adminAuthOtp, setAdminAuthOtp] = useState('');

      const [activeView, setActiveView] = useState('portal-cliente');
      const [cells, setCells] = useState(() => {
        try {
          const saved = localStorage.getItem('parkflow_cells');
          if (saved) return JSON.parse(saved);
        } catch(e) {}
        return initialCells;
      });
      const [time, setTime] = useState(new Date());
      const [selectedCell, setSelectedCell] = useState(null);
      const [isXamppOpen, setIsXamppOpen] = useState(false);
      const [toast, setToast] = useState(null);

      // Real-time Live Event Telemetry State (Synchronized via localStorage & cross-tab)
      const [lastLiveEvent, setLastLiveEvent] = useState(() => {
        try {
          const saved = localStorage.getItem('parkflow_last_event');
          return saved ? JSON.parse(saved) : null;
        } catch(e) { return null; }
      });

      // Administrator Live Sales Charts State ('daily' | 'monthly')
      const [salesChartTab, setSalesChartTab] = useState('daily');
      const [chartHoverInfo, setChartHoverInfo] = useState(null);

      // Client portal states
      const [clientSelectedSlot, setClientSelectedSlot] = useState('A-02');
      const [clientPlate, setClientPlate] = useState('');
      const [clientVehicleType, setClientVehicleType] = useState('Carro');
      const [clientIssuedTicket, setClientIssuedTicket] = useState(null);
      const [clientLookupPlate, setClientLookupPlate] = useState('');
      const [clientPaymentSuccess, setClientPaymentSuccess] = useState(false);

      // Salida y Cobro states
      const [searchQuery, setSearchQuery] = useState('KLO-892');
      const [paymentMethod, setPaymentMethod] = useState('cash');
      const [receivedAmount, setReceivedAmount] = useState(20000);
      const [checkoutSuccess, setCheckoutSuccess] = useState(false);
      const [secondsTicking, setSecondsTicking] = useState(25);

      // Tarifas states
      const [criticalThreshold, setCriticalThreshold] = useState(90);
      const [warningThreshold, setWarningThreshold] = useState(75);
      const [simulatedAforo, setSimulatedAforo] = useState(null);
      const [soundType, setSoundType] = useState('alarm');
      const [isTestingAudio, setIsTestingAudio] = useState(false);

      // Registro Operador states
      const [regPlate, setRegPlate] = useState('');
      const [regCat, setRegCat] = useState('Carro');

      useEffect(() => {
        const t = setInterval(() => {
          setTime(new Date());
          setSecondsTicking(s => (s + 1) % 60);
        }, 1000);

        // Cross-tab and real-time storage listener
        const onStorage = (e) => {
          if (e.key === 'parkflow_cells' && e.newValue) {
            try { setCells(JSON.parse(e.newValue)); } catch(err) {}
          }
          if (e.key === 'parkflow_last_event' && e.newValue) {
            try {
              const ev = JSON.parse(e.newValue);
              setLastLiveEvent(ev);
              playCyberAudio('laser');
              showToast(`📡 TELEMETRÍA EN VIVO: El cliente ${ev.driver} (${ev.plate}) ocupó la bahía ${ev.cellId}`, 'info');
            } catch(err) {}
          }
        };
        window.addEventListener('storage', onStorage);

        return () => {
          clearInterval(t);
          window.removeEventListener('storage', onStorage);
        };
      }, []);

      const showToast = (msg, type = 'info') => {
        setToast({ msg, type });
        setTimeout(() => setToast(null), 3000);
      };

      // Fill demo credentials
      const fillDemoCredentials = (role) => {
        playCyberAudio('click');
        if (role === 'cliente') {
          setClientAuthDoc('1020304050');
          setClientAuthName('Alejandro Vélez');
          setClientAuthPlate('KLO-892');
          setClientAuthPhone('310 987 6543');
        } else if (role === 'operador') {
          setOpAuthBadge('OP-418');
          setOpAuthName('Carlos Rojas');
          setOpAuthPin('4180');
          setOpAuthShift('Turno Mañana [06:00 - 14:00]');
        } else if (role === 'administrador') {
          setAdminAuthUser('admin.master');
          setAdminAuthKey('••••••••••••');
          setAdminAuthOtp('892-411');
        }
      };

      // Submit Auth
      const handleAuthenticate = (e) => {
        if (e) e.preventDefault();
        playCyberAudio('checkout');

        if (selectedRoleForAuth === 'cliente') {
          const doc = clientAuthDoc.trim() || '1020304050';
          const name = clientAuthName.trim() || 'Alejandro Vélez';
          const plate = (clientAuthPlate.trim() || 'KLO-892').toUpperCase();
          const phone = clientAuthPhone.trim() || '310 987 6543';

          const user = {
            role: 'cliente',
            id: doc,
            name: name,
            plate: plate,
            phone: phone,
            balance: 50000,
            points: 420,
            loginTime: new Date().toLocaleTimeString(),
          };
          setCurrentUser(user);
          setUserRole('cliente');
          setClientPlate(plate);
          setClientLookupPlate(plate);
          setShowRoleModal(false);
          setSelectedRoleForAuth(null);
          setActiveView('portal-cliente');
          showToast(`¡Bienvenido Conductor ${name}! Sesión segura iniciada.`, 'success');
        } else if (selectedRoleForAuth === 'operador') {
          const badge = opAuthBadge.trim() || 'OP-418';
          const name = opAuthName.trim() || 'Carlos Rojas';

          const user = {
            role: 'operador',
            id: badge,
            badge: badge,
            name: name,
            shift: opAuthShift,
            booth: 'Taquilla Norte 01',
            loginTime: new Date().toLocaleTimeString(),
          };
          setCurrentUser(user);
          setUserRole('operador');
          setShowRoleModal(false);
          setSelectedRoleForAuth(null);
          setActiveView('panel-operativo');
          showToast(`Turno de Operador activo: ${name} [${badge}]`, 'info');
        } else if (selectedRoleForAuth === 'administrador') {
          const user = {
            role: 'administrador',
            id: adminAuthUser.trim() || 'admin.master',
            name: 'Ing. Valderrama',
            level: 'NIVEL 4 // ROOT MASTER',
            loginTime: new Date().toLocaleTimeString(),
          };
          setCurrentUser(user);
          setUserRole('administrador');
          setShowRoleModal(false);
          setSelectedRoleForAuth(null);
          setActiveView('panel-operativo');
          showToast(`Acceso Maestro Verificado: Ing. Valderrama`, 'success');
        }
      };

      // Logout
      const handleLogout = () => {
        playCyberAudio('laser');
        setCurrentUser(null);
        setUserRole(null);
        setSelectedRoleForAuth(null);
        setShowRoleModal(true);
        setActiveView('portal-cliente');
        showToast('Sesión cerrada con éxito', 'info');
      };

      const selectRole = (role) => {
        playCyberAudio('click');
        setSelectedRoleForAuth(role);
      };

      const occupiedCount = cells.filter(c => c.status === 'occupied').length;
      const totalCells = 50;
      const currentOccupancy = simulatedAforo !== null ? simulatedAforo : Math.round((occupiedCount / totalCells) * 100);

      const handleNav = (v) => {
        // Strict Security Check for Cliente
        if (userRole === 'cliente') {
          const clientAllowed = ['portal-cliente', 'consulta-pago', 'mi-perfil-cliente'];
          if (!clientAllowed.includes(v)) {
            playCyberAudio('laser');
            showToast('ACCESO DENEGADO // Módulos internos restringidos a personal de parqueadero', 'error');
            return;
          }
        }
        // Strict Security Check for Operador
        if (userRole === 'operador') {
          const opRestricted = ['tarifas-y-celdas', 'reportes-y-auditoria'];
          if (opRestricted.includes(v)) {
            playCyberAudio('laser');
            showToast('RESTRICCIÓN // Módulo exclusivo para Administrador Global', 'warning');
            return;
          }
        }
        playCyberAudio('click');
        setActiveView(v);
      };

      // Client Occupy Action
      const handleClientOccupy = (e) => {
        e.preventDefault();
        if (!clientPlate || clientPlate.length < 3) {
          showToast('Por favor ingrese su número de placa', 'warning');
          return;
        }
        if (!clientSelectedSlot) {
          showToast('Seleccione un puesto libre en el mapa', 'warning');
          return;
        }
        playCyberAudio('checkout');
        const rate = clientVehicleType === 'Moto' ? 2200 : clientVehicleType === 'Camioneta' ? 6000 : 4500;
        const cleanPlate = clientPlate.trim().toUpperCase();
        const driverName = currentUser?.name || clientAuthName || 'Alejandro Vélez';
        const driverDoc = currentUser?.id || clientAuthDoc || '1020304050';
        const driverPhone = currentUser?.phone || clientAuthPhone || '310 987 6543';
        const timeStr = time.toLocaleTimeString();

        const newTicket = {
          ticketId: `#PK-CLI-${Math.floor(1000 + Math.random() * 9000)}`,
          plate: cleanPlate,
          cellId: clientSelectedSlot,
          category: clientVehicleType,
          entryTime: timeStr,
          ratePerHour: rate,
          driverName: driverName,
          driverDoc: driverDoc,
          driverPhone: driverPhone,
        };

        const updatedCells = cells.map(c => c.id === clientSelectedSlot ? {
          ...c,
          status: 'occupied',
          plate: cleanPlate,
          entryTime: timeStr,
          duration: '0h 01m',
          currentTotal: rate,
          ratePerHour: rate,

            <div className="fixed bottom-6 right-6 z-50 p-4 rounded-xl border border-cyan-500/40 bg-black/90 text-cyan-300 font-mono text-xs flex items-center gap-2 shadow-[0_0_20px_rgba(0,240,255,0.4)]">
              <span className="material-symbols-outlined text-[18px]">verified</span>
              <span>{toast.msg}</span>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
